<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lock-in</title>
<meta name="theme-color" content="#3A3156">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock-in">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,100..900,0..100,0..1;1,9..144,100..900,0..100,0..1&display=swap" rel="stylesheet">
<style>
/* Mise en page : colonne mobile centrée, hero rouge en camaïeu, tuiles à cocher, barre d'onglets en bas */
:root{
  --bg:#FBFAFF; --card:#FFFFFF; --rose-50:#ECEDFB; --rose-100:#E1E2F8; --rose-200:#CFD1F5; --rose-400:#9FA2E8;
  --red:#3A3156; --wine:#5B5585; --ink:#2D2756; --pale:#F4F3FF;
  --display:'Manrope','Segoe UI',sans-serif;
  --body:'Manrope','Segoe UI',sans-serif;
  --shadow:0 6px 20px rgba(58,49,86,.1);
  --stripes:repeating-linear-gradient(135deg,#C81E48 0 9px,#F9BCCB 9px 18px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{font-synthesis:none;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}
p{margin:0}
#app{max-width:560px;margin:0 auto;padding:16px 16px 112px}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.i{display:block;flex:none}

/* pastilles : seul endroit où le texte passe en capitales */
.pill{display:inline-block;text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--rose-200);color:var(--ink)}
.pill.pale{background:var(--rose-50);color:var(--wine)}
.pill.red{background:var(--red);color:var(--pale)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;color:var(--pale);background:linear-gradient(150deg,#9E1239 0%,#C81E48 60%,#D63B62 100%);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;justify-content:space-between}
.hero:before{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:rgba(249,188,203,.18)}
.hero:after{content:"";position:absolute;left:-40px;bottom:-90px;width:180px;height:180px;border-radius:50%;background:rgba(249,188,203,.12)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:46px;font-weight:800;letter-spacing:-.02em;margin:12px 0 8px}
.hero p{font-size:15px;max-width:19ch;color:var(--rose-50)}
.hero .lock{width:116px;height:116px;flex:none}
.banner{border-radius:26px;padding:20px;background:linear-gradient(150deg,#9E1239 0%,#C81E48 65%,#D63B62 100%);color:var(--pale);position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner:before{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:rgba(249,188,203,.2)}
.banner:after{content:"";position:absolute;right:46px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(249,188,203,.13)}
.banner>*{position:relative;z-index:1}
.banner h2{font-size:34px;font-weight:800;margin:10px 0 6px;letter-spacing:-.01em}
.banner p{font-size:15px;color:var(--rose-50);max-width:30ch}

section.block{margin-top:20px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec-title h3{font-size:22px;font-weight:700}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--wine);font-size:14px}

/* niveau */
.level{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.level-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.level-top b{font-family:var(--display);font-size:22px}
.bar{height:12px;border-radius:99px;background:var(--rose-100);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:repeating-linear-gradient(135deg,var(--red) 0 8px,var(--rose-400) 8px 16px);transition:width .5s ease}

/* navigateur de jour */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .lbl{text-align:center;flex:1}
.daynav .lbl b{display:block;font-family:var(--display);font-size:22px;font-weight:700;text-transform:none}
.circ{width:44px;height:44px;border-radius:50%;background:var(--rose-50);color:var(--ink);display:grid;place-items:center}
.circ:disabled{opacity:.35;cursor:default}

/* score du jour */
.score{margin-top:14px}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 8px}
.segs i{height:14px;border-radius:99px;background:var(--rose-100)}
.segs i.on{background:repeating-linear-gradient(135deg,var(--red) 0 8px,var(--rose-400) 8px 16px)}
.score-row{display:flex;justify-content:space-between;align-items:baseline}
.score-row b{font-family:var(--display);font-size:30px}

/* tuiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:22px;background:var(--rose-50);color:var(--ink);min-height:128px;transition:transform .15s ease,background .2s ease}
.tile:active{transform:scale(.97)}
.tile .ico{width:46px;height:46px;border-radius:16px;background:var(--pale);display:grid;place-items:center;color:var(--red)}
.tile .tl{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.1;padding-right:6px}
.tile .chk{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;border:2px solid var(--rose-400);display:grid;place-items:center;color:transparent}
.tile.on{background:var(--red);color:var(--pale)}
.tile.on .ico{background:rgba(255,243,246,.2);color:var(--pale)}
.tile.on .chk{background:var(--pale);border-color:var(--pale);color:var(--red)}
.tile.pop{animation:pop .35s ease}
.tile .pill{align-self:flex-start;font-size:10px;padding:3px 9px}
.tile.on .pill{background:var(--rose-50);color:var(--wine)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;min-height:0;gap:14px}
.tile.wide .mid{flex:1;display:flex;flex-direction:column;gap:8px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--rose-100)}
.dots i.on{background:var(--red)}
.tile.on .dots i{background:rgba(255,243,246,.3)}
.tile.on .dots i.on{background:var(--pale)}
.tile.wide .chk{position:static;flex:none}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.locked-note{margin-top:12px;font-size:14px;color:var(--wine);background:var(--rose-50);padding:10px 14px;border-radius:14px}

/* anneau */
.ringwrap{display:flex;gap:16px;align-items:center}
.ring{width:132px;height:132px;flex:none}
.ring text{font-family:var(--display);fill:var(--ink)}
.stats-mini{display:grid;gap:10px;flex:1}
.stats-mini div{display:flex;flex-direction:column}
.stats-mini b{font-family:var(--display);font-size:28px;line-height:1}
.stats-mini span{font-size:13px;color:var(--wine)}

/* stats habitudes */
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hstat{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--rose-50);color:var(--ink);margin-bottom:10px}
.hstat .ico{width:44px;height:44px;border-radius:15px;background:var(--pale);display:grid;place-items:center;color:var(--red)}
.hstat h4{font-family:var(--display);font-size:17px;margin:0 0 6px;font-weight:700}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums div{display:flex;flex-direction:column}
.nums b{font-family:var(--display);font-size:24px;line-height:1}
.nums span{font-size:12px}
.hstat.mid{background:var(--rose-200)}
.hstat.top{background:var(--red);color:var(--pale)}
.hstat.top .ico{background:rgba(255,243,246,.2);color:var(--pale)}

/* calendrier */
.cal{display:grid;grid-template-columns:34px repeat(7,1fr) 38px;gap:6px;align-items:center}
.cal .dow{font-size:12px;font-weight:700;color:var(--wine);text-align:center}
.cal .wk{font-size:12px;font-weight:700;color:var(--wine)}
.cal .rf{font-size:12px;font-weight:700;text-align:center;color:var(--wine)}
.cell{aspect-ratio:1;border-radius:12px;font-weight:700;font-size:13px;display:grid;place-items:center;background:#FBE5EB;color:var(--ink);position:relative}
.cell.l1{background:var(--rose-200)}
.cell.l2{background:var(--rose-400)}
.cell.l3{background:var(--red);color:var(--pale)}
.cell.l4{background:var(--wine);color:var(--pale)}
.cell.fut{opacity:.4;cursor:default}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px}
.cell.rn:after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:currentColor}

/* badges */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;background:var(--rose-50);color:var(--ink)}
.badge .ico{width:40px;height:40px;border-radius:14px;background:var(--pale);display:grid;place-items:center;color:var(--red);flex:none}
.badge b{display:block;font-family:var(--display);font-size:15px;line-height:1.1}
.badge span{font-size:12px;color:var(--wine);display:block;margin-top:2px;line-height:1.25}
.badge.off{background:var(--card);box-shadow:inset 0 0 0 2px var(--rose-100)}
.badge.off .ico{background:var(--rose-50);color:var(--rose-400)}
.badge.on{background:var(--red);color:var(--pale)}
.badge.on span{color:var(--rose-50)}
.badge.on .ico{background:rgba(255,243,246,.2);color:var(--pale)}

/* programme */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 16px;border-radius:99px;background:var(--rose-50);font-weight:700;font-size:15px;color:var(--ink)}
.chip.on{background:var(--red);color:var(--pale)}
.chip.now{box-shadow:inset 0 0 0 2px var(--red)}
.chip.on.now{box-shadow:none}
.picker{display:flex;flex-direction:column;gap:12px}
.group{margin-top:16px}
.group .gh{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.ex{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);padding:12px;border-radius:18px;margin-bottom:8px;box-shadow:var(--shadow)}
.ex.done{background:var(--rose-50)}
.ex h4{font-family:var(--display);font-size:17px;margin:0;font-weight:700}
.ex .meta{font-size:13px;color:var(--wine);margin-top:2px}
.ex .log{grid-column:1/-1;width:100%;border:2px solid var(--rose-100);background:var(--pale);border-radius:12px;padding:9px 12px;font-size:15px;color:var(--ink)}
.ex .log::placeholder{color:#A8587A}
.ex .log:focus{outline:none;border-color:var(--red)}
.ok{width:40px;height:40px;border-radius:50%;border:2px solid var(--rose-400);display:grid;place-items:center;color:transparent;background:transparent}
.ok.on{background:var(--red);border-color:var(--red);color:var(--pale)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;border-radius:99px;background:var(--red);color:var(--pale);font-weight:700;font-size:16px;margin-top:14px}
.btn.soft{background:var(--rose-50);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.tips{margin:10px 0 0;padding-left:20px;font-size:15px}
.tips li{margin-bottom:4px}

.vid{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.vid a{font-size:13px;font-weight:700;color:var(--wine);background:var(--rose-100);padding:6px 12px;border-radius:99px;text-decoration:none}
/* règles */
details.rule{background:var(--card);border-radius:22px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
details.rule summary{list-style:none;display:grid;grid-template-columns:52px 1fr 24px;gap:12px;align-items:center;padding:14px;cursor:pointer}
details.rule summary::-webkit-details-marker{display:none}
.rule .num{width:52px;height:52px;border-radius:18px;background:var(--red);color:var(--pale);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px}
.rule h3{font-size:19px;font-weight:700}
.rule .chev{color:var(--red);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.rule .body{padding:0 16px 16px 16px}
.rule .body p{font-size:15px}
.rule .ico{width:40px;height:40px;border-radius:14px;background:var(--rose-50);display:grid;place-items:center;color:var(--red);margin-bottom:10px}
.closing{background:var(--rose-100);border-radius:22px;padding:30px 18px 18px;margin-top:6px;position:relative;overflow:hidden}
.closing:before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:var(--stripes)}
.closing h3{font-size:22px;margin-bottom:6px}

/* todo */
.tg{margin-top:16px}
.tg h3{font-size:17px;font-weight:700;margin:0 2px 8px}
.todo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);margin-bottom:8px}
.todo .box{width:28px;height:28px;border-radius:10px;border:2px solid var(--rose-400);display:grid;place-items:center;flex:none;color:transparent}
.todo.on{background:var(--rose-50)}
.todo.on .box{background:var(--red);border-color:var(--red);color:var(--pale)}
.todo.on .t{text-decoration:line-through;text-decoration-color:var(--rose-400)}
.todo .t{flex:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:2px solid var(--rose-100);background:var(--card);border-radius:99px;padding:12px 16px;color:var(--ink)}
.addrow input:focus{outline:none;border-color:var(--red)}
.addrow input::placeholder{color:#A8587A}
.addrow button{width:48px;height:48px;border-radius:50%;background:var(--red);color:var(--pale);display:grid;place-items:center;flex:none}
.rm{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--wine);flex:none}

/* tab bar */

/* cartes pastel inspirées de la référence : titre fin puis gras, icône sur pastille teintée, numéro en pastille fine */
.l{font-weight:300}
.tile.ccard,.tile.ccard.on{background-color:var(--c-bg);color:var(--c-fg);min-height:178px;justify-content:space-between;gap:14px;border-radius:28px;padding:18px 16px 16px;overflow:hidden}
.ccard .tt{display:block;font-size:22px;line-height:1.08;letter-spacing:-.01em;padding-right:34px}
.ccard .tt .l{display:block;font-weight:300}
.ccard .tt b{display:block;font-weight:800}
.ccard .tt .sub{display:block;font-size:13px;font-weight:500;margin-top:6px;letter-spacing:0}
.ccard .bot{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tile.ccard .ico,.tile.ccard.on .ico{width:40px;height:40px;border-radius:13px;background:var(--c-tile);color:var(--c-fg)}
.tile.ccard .chk{border-color:var(--c-fg);color:transparent;background:transparent;right:14px;top:14px}
.tile.ccard.on .chk{background:var(--c-fg);border-color:var(--c-fg);color:var(--c-bg)}
.tile.ccard.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--stripes)}
.tile.ccard.wide{flex-direction:column;align-items:stretch;min-height:150px}
.tile.ccard.wide .chk{position:absolute}
.ccard .dots i{background:var(--c-tile)}
.ccard .dots i.on{background:var(--c-fg)}
.npill{border:1px solid currentColor;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;line-height:1.3}
.npill.up{font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px}
details.rule{background-color:var(--c-bg);color:var(--c-fg)}
details.rule summary{grid-template-columns:44px 1fr auto}
.rule .num{width:44px;height:44px;border-radius:15px;background:var(--c-tile);color:var(--c-fg)}
.rule h3{font-size:20px;font-weight:800;line-height:1.1}
.rule .l{font-weight:300}
.rule .chev{color:var(--c-fg)}
.rule .ico{background:var(--c-tile);color:var(--c-fg)}

/* rayures rouge et rose */
.ribbon{height:12px;border-radius:99px;background:var(--stripes);margin:14px 6px 0}
nav.tabs:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--stripes)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,243,246,.94);backdrop-filter:blur(10px);padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(140,18,55,.1)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:700;color:var(--wine)}
nav.tabs button.on{background:var(--red);color:var(--pale)}

.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);opacity:0;background:var(--wine);color:var(--pale);padding:12px 18px;border-radius:99px;font-weight:700;font-size:15px;box-shadow:var(--shadow);z-index:40;transition:all .3s ease;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:24px;font-size:13px;color:var(--wine);text-align:center}
.foot a{color:var(--wine)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.hero h1{font-size:38px}.hero .lock{width:92px;height:92px}.tile .tl{font-size:16px}}

/* identité pastel : une teinte par catégorie, camaïeu clair / moyen / foncé */
/* 5 teintes pastel, 3 tons chacune. Seul le indigo de la lavande reste foncé, comme la carte sombre de la référence */
.pe1{--c-bg:#FBE6D6;--c-tile:#F6D0B4;--c-fg:#5A2E16}
.pe2{--c-bg:#F6D0B4;--c-tile:#EFBD96;--c-fg:#5A2E16}
.pe3{--c-bg:#F0BB92;--c-tile:#E8A87A;--c-fg:#5A2E16}
.ye1{--c-bg:#FCF3D0;--c-tile:#F9E8A8;--c-fg:#4A3A06}
.ye2{--c-bg:#F9E8A8;--c-tile:#F4D977;--c-fg:#4A3A06}
.ye3{--c-bg:#F5DA7B;--c-tile:#EDC95A;--c-fg:#4A3A06}
.gr1{--c-bg:#E8F5EA;--c-tile:#CDE8D2;--c-fg:#1F4D2E}
.gr2{--c-bg:#CDE8D2;--c-tile:#B3DABB;--c-fg:#1F4D2E}
.gr3{--c-bg:#AFD9B7;--c-tile:#93C99F;--c-fg:#1F4D2E}
.pi1{--c-bg:#FAECEE;--c-tile:#F4D3D9;--c-fg:#5E2535}
.pi2{--c-bg:#F4D3D9;--c-tile:#ECBAC4;--c-fg:#5E2535}
.pi3{--c-bg:#EDB9C4;--c-tile:#E39DAD;--c-fg:#5E2535}
.la1{--c-bg:#E9EAFB;--c-tile:#D2D4F6;--c-fg:#2D2756}
.la2{--c-bg:#D2D4F6;--c-tile:#B9BCF0;--c-fg:#2D2756}
.la3{--c-bg:#3A3156;--c-tile:#52497E;--c-fg:#ECEBFA}
.pill.c{background:var(--c-bg);color:var(--c-fg)}
.hero{background:#3A3156}
.hero:before{background:rgba(207,209,245,.14)}
.hero:after{background:rgba(207,209,245,.09)}
.banner{background:var(--c-bg);color:var(--c-fg);box-shadow:none}
.banner:before{background:rgba(255,255,255,.4)}
.banner:after{background:rgba(255,255,255,.28)}
.banner p{color:var(--c-fg)}
.banner .pill{background:transparent;color:var(--c-fg);border:1px solid currentColor}
.ribbon,nav.tabs:before,.closing:before{display:none}
.closing{padding:18px}
.bar>i,.segs i.on{background:repeating-linear-gradient(135deg,#3A3156 0 5px,#B9BCF0 5px 10px)}
.tile.ccard.on:after{background:var(--c-fg);opacity:.3}
.hstat{background:var(--c-bg);color:var(--c-fg)}

function runs(h){
  const t=todayIdx();let total=0,best=0,run=0;
  for(let i=0;i<N;i++){if(has(i,h)){total++;run++;if(run>best)best=run;}else run=0;}
  let i=Math.min(t,N-1);if(i>=0&&!has(i,h))i--;

  return{total:total,cur:cur,best:best};
}

let ref=null,writing=false,pending=false,wt=null;
function persistLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function save(){S.ts=Date.now();persistLocal();if(ref){clearTimeout(wt);wt=setTimeout(flush,800);}}
async function flush(){
  if(!ref)return;if(writing){pending=true;return;}
  writing=true;
  try{await ref.set({state:JSON.stringify(S),ts:S.ts});syncMode='cloud';}catch(e){}
  writing=false;
  if(pending){pending=false;flush();}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const user=await window.claude.use('user');const db=await window.claude.use('db');
    if(!user||!db)return;const id=await user.id();if(!id)return;
    ref=db.collection('data/users/'+id).doc('lockin');
    const snap=await ref.get();
    if(snap.exists){
      const r=snap.data();
      if(r&&r.state){const rs=JSON.parse(r.state);if((rs.ts||0)>(S.ts||0)){S=Object.assign(blank(),rs);persistLocal();render();}}
      syncMode='cloud';
    }else{syncMode='cloud';if(S.ts)flush();}
    if(tab==='suivi')render();
  }catch(e){ref=null;}
}

  const n=todoDone();
  let h=banner('Avant 2027','<span class="l">Ma</span><br>to-do','10 choses à accomplir pour finir l’année en beauté.','la2');
  h+='<section class="block"><div class="card"><div class="level-top"><b style="font-family:var(--display);font-size:20px">'+n+' sur 10</b><span class="muted">+15 XP par action</span></div><div class="bar" style="margin-top:10px"><i style="width:'+n*10+'%"></i></div></div>';
  TODO_G.forEach((g,gi)=>{h+='<div class="tg '+'la1'+'"><h3>'+g.g+'</h3>'+g.items.map(it=>{const on=!!S.todo[it[0]];return '<button class="todo'+(on?' on':'')+'" data-act="todo" data-t="'+it[0]+'" aria-pressed="'+on+'"><span class="box">'+ic('check',18)+'</span><span class="t">'+it[1]+'</span></button>';}).join('')+'</div>';});
  h+='<div class="tg la1"><h3>Mes ajouts</h3>'+S.custom.map(c=>'<div class="todo'+(c.ok?' on':'')+'"><button class="box" style="background:'+(c.ok?'var(--red)':'transparent')+';border:2px solid '+(c.ok?'var(--red)':'var(--rose-400)')+';color:'+(c.ok?'var(--pale)':'transparent')+';width:28px;height:28px;border-radius:10px;display:grid;place-items:center" data-act="ctoggle" data-id="'+c.id+'" aria-label="Cocher">'+ic('check',18)+'</button><span class="t">'+esc(c.t)+'</span><button class="rm" data-act="cdel" data-id="'+c.id+'" aria-label="Supprimer">'+ic('x',18)+'</button></div>').join('')+'<div class="addrow"><input id="newtodo" type="text" placeholder="Ajouter une envie" maxlength="80" aria-label="Nouvelle action"><button data-act="cadd" aria-label="Ajouter">'+ic('plus')+'</button></div></div></section>';
  return h;
}

function render(){
  const y=window.scrollY;
  const v={aujourdhui:viewToday,suivi:viewSuivi,programme:viewProg,regles:viewRegles,todo:viewTodo}[tab]();
  document.getElementById('view').innerHTML=v+'<p class="foot">D’après l’Opération Lock-in de zoeamalys · <a href="'+NOTION_URL+'">page d’origine</a></p>';
  document.getElementById('tabs').innerHTML=TABS.map(t=>'<button class="'+(t[0]===tab?'on':'')+'" data-act="tab" data-v="'+t[0]+'" aria-current="'+(t[0]===tab)+'">'+ic(t[2],26)+t[1]+'</button>').join('');
  document.title='Lock-in pastel';
  window.scrollTo(0,y);
}
function go(t){tab=t;try{history.replaceState(null,'','#'+t);}catch(e){try{location.hash=t;}catch(e2){}}window.scrollTo(0,0);render();}

/* ---------- événements ---------- */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='tab'){go(el.dataset.v);return;}
  if(a==='day'){sel=Math.max(0,Math.min(N-1,sel+Number(el.dataset.d)));render();return;}
  if(a==='goto'){sel=Number(el.dataset.i);go('aujourdhui');return;}
  if(a==='tick'){
    const t=todayIdx();if(sel>t){toast('Ce jour n’est pas encore arrivé');return;}
    const p=snap(),h=el.dataset.h,arr=S.d[sel]?S.d[sel].slice():[],k=arr.indexOf(h);
    if(k>-1)arr.splice(k,1);else arr.push(h);
    S.d[sel]=arr;save();render();
    const tile=document.querySelector('[data-h="'+h+'"]');if(tile&&k<0)tile.classList.add('pop');
    after(p,k<0&&score(sel)===6);return;
  }
  if(a==='rule'){const v=Number(el.dataset.i);ruleSel=(ruleSel===v?-1:v);render();return;}
  if(a==='ps'){progS=Number(el.dataset.v);render();return;}
  if(a==='pw'){progW=Number(el.dataset.v);render();return;}
  if(a==='exok'){const k=el.dataset.k;S.ex[k]=S.ex[k]||{};S.ex[k].ok=S.ex[k].ok?0:1;save();render();return;}
  if(a==='sessdone'){
    const t=todayIdx();if(t<0||t>=N+1){toast('Le challenge n’a pas commencé');return;}
    const day=Math.min(t,N-1),p=snap();const arr=S.d[day]?S.d[day].slice():[];
    if(arr.indexOf('renfo')<0){arr.push('renfo');S.d[day]=arr;save();after(p,false);toast('Renfo coché pour aujourd’hui');}else toast('Le renfo est déjà coché aujourd’hui');
    return;
  }
  if(a==='todo'){const p=snap();S.todo[el.dataset.t]=S.todo[el.dataset.t]?0:1;save();render();after(p,false);return;}
  if(a==='ctoggle'){const c=S.custom.find(x=>x.id===el.dataset.id);if(c){c.ok=c.ok?0:1;save();render();}return;}
  if(a==='cdel'){S.custom=S.custom.filter(x=>x.id!==el.dataset.id);save();render();return;}
  if(a==='cadd'){const inp=document.getElementById('newtodo');const v=inp.value.trim();if(!v)return;S.custom.push({id:'c'+Date.now(),t:v,ok:0});save();render();return;}
});
document.addEventListener('input',function(e){
  const k=e.target&&e.target.dataset&&e.target.dataset.ex;if(!k)return;
  S.ex[k]=S.ex[k]||{};S.ex[k].v=e.target.value;save();
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='newtodo'){e.preventDefault();document.querySelector('[data-act="cadd"]').click();}});
window.addEventListener('hashchange',function(){const h=location.hash.replace('#','');if(TABS.some(t=>t[0]===h)&&h!==tab){tab=h;render();}});

/* ---------- démarrage ---------- */
(function(){
  const t=todayIdx();sel=Math.max(0,Math.min(t,N-1));progW=Math.max(0,Math.min(Math.floor(t/7),5));
  const h=location.hash.replace('#','');if(TABS.some(x=>x[0]===h))tab=h;
  render();initRemote();
})();
})();
</script>
</body>
</html>
